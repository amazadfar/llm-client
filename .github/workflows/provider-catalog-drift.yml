name: Provider catalog drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema>=4.26,<5"
      - run: python scripts/catalog/validate_provider_catalog.py --online --strict-staleness
