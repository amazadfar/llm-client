services:
  telic_postgres:
    image: postgres:16-alpine
    container_name: telic_postgres
    environment:
      POSTGRES_DB: telic
      POSTGRES_USER: telic
      POSTGRES_PASSWORD: telic
    ports:
      - "${TELIC_PG_PORT:-5434}:5432"
    volumes:
      - telic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telic -d telic"]
      interval: 5s
      timeout: 3s
      retries: 20

  telic_redis:
    image: redis:7-alpine
    container_name: telic_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${TELIC_REDIS_PORT:-6381}:6379"
    volumes:
      - telic_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  telic_qdrant:
    image: qdrant/qdrant:latest
    container_name: telic_qdrant
    ports:
      - "${TELIC_QDRANT_PORT:-6334}:6333"
    volumes:
      - telic_qdrant_data:/qdrant/storage

  telic_mysql:
    image: mysql:8.4
    container_name: telic_mysql
    environment:
      MYSQL_DATABASE: telic
      MYSQL_USER: telic
      MYSQL_PASSWORD: telic
      MYSQL_ROOT_PASSWORD: telic_root
    ports:
      - "${TELIC_MYSQL_PORT:-3307}:3306"
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION",
      ]
    volumes:
      - telic_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -ptelic_root >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  telic_postgres_data:
  telic_redis_data:
  telic_qdrant_data:
  telic_mysql_data:
